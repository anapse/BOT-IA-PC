name: Deploy Web App to Firebase Hosting
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'cloudflare-worker/**'
      - 'worker/**'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOT_IA_PC }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Check Firebase Service Account Credential
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: |
          echo "::error::Falta la credencial administrativa FIREBASE_SERVICE_ACCOUNT_BOT_IA_PC en los secretos de GitHub."
          echo "Para desplegar en Firebase Hosting (gen-lang-client-0164582744), debes agregar el secreto de repositorio en GitHub con la clave privada JSON de la cuenta de servicio de Firebase."
          exit 1

      - name: Deploy to Firebase Hosting
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOT_IA_PC }}
          projectId: gen-lang-client-0164582744
          channelId: live
