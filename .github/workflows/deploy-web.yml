name: Deploy Web App
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'cloudflare-worker/**'
      - 'worker/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # If Firebase Service Account secret is available, deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOT_IA_PC != '' }}"
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOT_IA_PC }}
          projectId: gen-lang-client-0164582744
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels

      # Native zero-secret fallback: Deploy to GitHub Pages automatically
      - name: Setup Pages
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOT_IA_PC == '' }}"
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOT_IA_PC == '' }}"
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOT_IA_PC == '' }}"
        uses: actions/deploy-pages@v4
